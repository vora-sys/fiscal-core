name: Contratos FIPE
on:
  push:
    branches: ['codex/fipe-fallbacks-20261008']
    tags: ['v2.3.*']
  pull_request:
    paths: ['src/Fipe/**', 'src/Contracts/*Fipe*', 'src/Facade/UtilsFacade.php', 'tests/Unit/Fiscal/FipeFallbackTest.php', '.github/workflows/fipe-fallbacks.yml']
permissions:
  contents: read
jobs:
  contratos:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: curl, dom, json, libxml, mbstring, openssl, soap, zip
          coverage: none
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction --no-scripts --no-plugins
      - if: matrix.php == '8.4'
        run: composer require --dev hertzogjr/fipe-php-sdk:^1.0 --no-interaction --no-scripts --no-plugins
      - if: matrix.php == '8.1'
        run: php vendor/bin/phpunit tests/Unit/Fiscal/FipeFallbackTest.php tests/Unit/Fiscal/ConsultasPublicasComplementaresTest.php
      - if: matrix.php == '8.4'
        run: php vendor/bin/phpunit --fail-on-skipped tests/Unit/Fiscal/FipeFallbackTest.php tests/Unit/Fiscal/ConsultasPublicasComplementaresTest.php
